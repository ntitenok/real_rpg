<div class="panel-head">
  <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#e8d5a0" stroke-width="1.5">
      <path d="M6 18L18 6M14 4l6 6M4 20l3-1 1-3" />
    </svg></div>
  <h2>В игре</h2>
</div>

<div class="game-stack">

  <!-- РЯД 1: Параметры + Противник -->
  <div class="row-2col">
    <div class="sub-block" id="player-stats">
      <div class="sub-title"><svg viewBox="0 0 24 24" fill="none" stroke="#c9a866" stroke-width="1.6">
          <path d="M12 2l7 4v6c0 5-3 8-7 10-4-2-7-5-7-10V6z" />
        </svg>Параметры</div>
    </div>
    <div class="sub-block" id="enemy-block">
      <div class="sub-title"><svg viewBox="0 0 24 24" fill="none" stroke="#c9a866" stroke-width="1.6">
          <path d="M12 2c-2 3-5 3-5 7 0 3 2 5 5 5s5-2 5-5c0-4-3-4-5-7z" />
          <path d="M8 18h8l-1 3H9z" />
        </svg>Противник</div>
    </div>
  </div>

  <!-- РЯД 2: Быстрые способности -->
  <div class="sub-block" id="abilities-block">
    <div class="sub-title"><svg viewBox="0 0 24 24" fill="none" stroke="#c9a866" stroke-width="1.6">
        <path d="M12 2l1.5 4 4 .5-3 3 .8 4-3.3-2-3.3 2 .8-4-3-3 4-.5z" />
      </svg>Быстрые способности</div>
    <div class="abilities-row" id="abilities-list"></div>
  </div>

  <!-- РЯД 3: Активные задачи -->
  <div class="sub-block">
    <div class="sub-title"><svg viewBox="0 0 24 24" fill="none" stroke="#c9a866" stroke-width="1.6">
        <rect x="5" y="3" width="14" height="18" rx="1.5" />
        <path d="M9 8h6M9 12h6M9 16h4" />
      </svg>Активные задачи</div>
    <div id="active-tasks-list"></div>
  </div>

  <!-- РЯД 4: Активная цель -->
  <div class="sub-block" id="active-goal-block">
    <div class="sub-title"><svg viewBox="0 0 24 24" fill="none" stroke="#c9a866" stroke-width="1.6">
        <circle cx="12" cy="12" r="8" />
        <circle cx="12" cy="12" r="4" />
        <circle cx="12" cy="12" r="0.6" fill="#c9a866" />
      </svg>Активная цель</div>
  </div>

  <!-- РЯД 5: Добавление задачи или цели -->
  <div class="sub-block">
    <div class="sub-title"><svg viewBox="0 0 24 24" fill="none" stroke="#c9a866" stroke-width="1.6">
        <path d="M12 5v14M5 12h14" />
      </svg>Добавить задачу или цель</div>
    <div class="add-form" id="add-form">
      <div class="form-row">
        <div><label>Тип</label>
          <select id="add-type">
            <option value="task">Задача</option>
            <option value="goal">Цель</option>
          </select>
        </div>
      </div>
      <div><label>Название</label><input type="text" id="add-title" placeholder="Например: Настроить CI/CD"></div>
      <div><label>Описание</label><textarea id="add-desc" placeholder="Необязательно"></textarea></div>

      <!-- Поля для задачи (скрываются при выборе "Цель") -->
      <div id="task-fields">
        <div>
          <label>Навыки (прокрутка, по алфавиту)</label>
          <div class="skills-scroll" id="skills-checklist"></div>
        </div>
        <div><label>Цель</label>
          <select id="add-goal">
            <option value="">Без привязки</option>
          </select>
        </div>

        <!-- Спойлер: Усиления -->
        <div style="margin-top:10px;">
          <button type="button" class="spoiler-toggle" data-target="spoiler-boosts"
            style="background:none; border:none; color:#c9a866; font-family:Georgia, serif; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px;">
            <span>👁️</span> Усиления (опционально)
          </button>
          <div id="spoiler-boosts"
            style="display:none; margin-top:8px; padding:8px; background:rgba(0,0,0,0.15); border-radius:6px;">
            <div class="slider-row">
              <div class="slider-top"><span>Сопротивление</span><span id="resistance-val">0</span></div>
              <input type="range" min="0" max="100" value="0" id="add-resistance">
            </div>
            <div class="slider-row">
              <div class="slider-top"><span>Важность</span><span id="importance-val">0</span></div>
              <input type="range" min="0" max="100" value="0" id="add-importance">
            </div>
            <div class="slider-row">
              <div class="slider-top"><span>Срочность</span><span id="urgency-val">0</span></div>
              <input type="range" min="0" max="100" value="0" id="add-urgency">
            </div>
          </div>
        </div>

        <!-- Спойлер: Плановое время -->
        <div style="margin-top:10px;">
          <button type="button" class="spoiler-toggle" data-target="spoiler-time"
            style="background:none; border:none; color:#c9a866; font-family:Georgia, serif; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px;">
            <span>👁️</span> Плановое время (минуты)
          </button>
          <div id="spoiler-time"
            style="display:none; margin-top:8px; padding:8px; background:rgba(0,0,0,0.15); border-radius:6px;">
            <input type="number" id="add-planned" placeholder="0" value="0" min="0" step="1"
              style="width:100%; background:rgba(0,0,0,0.25); border:1px solid rgba(201,168,102,0.25); border-radius:5px; color:#dcd0b8; font-family:Georgia, serif; font-size:13px; padding:8px 10px;">
          </div>
        </div>
      </div>

      <!-- Кнопка Добавить всегда видна -->
      <button class="btn-add" id="add-btn" style="margin-top:6px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#f0dfa8" stroke-width="1.8">
          <path d="M12 5v14M5 12h14" />
        </svg>
        Добавить
      </button>
      
      <!-- Чекбокс (скрывается при выборе "Цель") -->
      <div id="task-active-wrapper" style="display:flex; align-items:center; gap:6px; margin-top:4px; flex-wrap:wrap;">
        <label style="display:flex; align-items:center; gap:6px; font-size:13px; color:#c4b696;">
          <input type="checkbox" id="add-is-active" checked style="accent-color:#c9a866; width:16px; height:16px;">
          Сделать задачу активной
        </label>
      </div>
    </div>
  </div>

</div>
