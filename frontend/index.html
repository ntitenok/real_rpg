<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Журнал приключений</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Georgia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Блок авторизации -->
  <div id="auth-container">
    <div class="auth-box">
      <h2>Вход / Регистрация</h2>
      <input type="text" id="auth-username" placeholder="Логин">
      <input type="password" id="auth-password" placeholder="Пароль">
      <button id="login-btn">Войти</button>
      <button id="register-btn">Зарегистрироваться</button>
      <div id="auth-message"></div>
    </div>
  </div>

  <!-- Блок профиля -->
  <div id="profile-container" style="display: none;">
    <span id="username-display"></span>
    <button id="logout-btn">Выйти</button>
  </div>

  <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
  <div id="main-content" style="display: none;">
    <div class="container">
      <!-- Декоративные уголки -->
      <svg class="ornament tl" viewBox="0 0 48 48" stroke="#c9a866" stroke-width="1" fill="none">
        <path d="M2 2 L2 22 M2 2 L22 2 M2 10 Q10 10 10 2" opacity="0.85" />
        <circle cx="2" cy="2" r="2" fill="#c9a866" />
      </svg>
      <svg class="ornament tr" viewBox="0 0 48 48" stroke="#c9a866" stroke-width="1" fill="none">
        <path d="M2 2 L2 22 M2 2 L22 2 M2 10 Q10 10 10 2" opacity="0.85" />
        <circle cx="2" cy="2" r="2" fill="#c9a866" />
      </svg>
      <svg class="ornament bl" viewBox="0 0 48 48" stroke="#c9a866" stroke-width="1" fill="none">
        <path d="M2 2 L2 22 M2 2 L22 2 M2 10 Q10 10 10 2" opacity="0.85" />
        <circle cx="2" cy="2" r="2" fill="#c9a866" />
      </svg>
      <svg class="ornament br" viewBox="0 0 48 48" stroke="#c9a866" stroke-width="1" fill="none">
        <path d="M2 2 L2 22 M2 2 L22 2 M2 10 Q10 10 10 2" opacity="0.85" />
        <circle cx="2" cy="2" r="2" fill="#c9a866" />
      </svg>

      <header>
        <div class="title-row">
          <div class="seal">
            <svg viewBox="0 0 24 24" fill="none" stroke="#e8d5a0" stroke-width="1.4">
              <path d="M6 3h9l3 3v15H6z" />
              <path d="M15 3v3h3" />
              <path d="M9 9h6M9 12h6M9 15h4" />
            </svg>
          </div>
          <h1>Журнал приключений</h1>
        </div>
        <div class="flourish">
          <div class="flourish-mark">
            <svg viewBox="0 0 16 16" fill="none" stroke="#c9a866" stroke-width="1.2">
              <path d="M8 1l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" />
            </svg>
          </div>
        </div>
        <div class="status-row">
          <div class="status-chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="#c9a866" stroke-width="1.6">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3.5 2" />
            </svg>
            Общее время: <b id="totalTimeDisplay">0 мин</b>
          </div>
          <div class="status-chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="#c9a866" stroke-width="1.6">
              <rect x="5" y="3" width="14" height="18" rx="1.5" />
              <path d="M9 8h6M9 12h6M9 16h4" />
            </svg>
            Задач: <b id="tasksCount">0</b>
          </div>
          <div class="status-chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="#c9a866" stroke-width="1.6">
              <circle cx="12" cy="12" r="8" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="12" cy="12" r="0.6" fill="#c9a866" />
            </svg>
            Целей: <b id="goalsCount">0</b>
          </div>
        </div>
        <div class="level-block">
          <svg viewBox="0 0 24 24" fill="none" stroke="#e8d5a0" stroke-width="1.5">
            <path d="M12 2l2.5 5.5L20 9l-4.2 4 1 6.2L12 16l-4.8 3.2 1-6.2L4 9l5.5-1.5z" />
          </svg>
          Уровень персонажа: <b id="playerLevelDisplay">1</b>
        </div>
      </header>

      <!-- ОСНОВНАЯ ОБЛАСТЬ: контент слева, меню справа -->
      <div class="main">
        <!-- Контент -->
        <div class="content">
            <div class="panel" id="tabs-container">
              <div id="tab-focus" class="tab-content"></div>
              <div id="tab-game" class="tab-content"></div>
              <div id="tab-tasks" class="tab-content"></div>
              <div id="tab-character" class="tab-content active"></div>
              <div id="tab-abilities" class="tab-content"></div>
              <div id="tab-inventory" class="tab-content"></div>
              <div id="tab-achievements" class="tab-content"></div>
              <div id="tab-settings" class="tab-content"></div>
            </div>
        </div> <!-- закрываем content -->

        <!-- ===== МЕНЮ (справа) ===== -->
        <div class="menu">
          <div class="menu-list">
            <div class="menu-item" data-tab="focus"><svg viewBox="0 0 24 24" fill="none" stroke="#8a7a63"
                stroke-width="1.5">
                <path d="M4 6l7-3 7 3 2-1v14l-2 1-7-3-7 3-2-1V5z" />
                <path d="M11 3v14M18 5v14" />
              </svg>Фокус</div>
            <div class="menu-item" data-tab="game"><svg viewBox="0 0 24 24" fill="none" stroke="#8a7a63"
                stroke-width="1.5">
                <path d="M6 18L18 6M14 4l6 6M4 20l3-1 1-3" />
              </svg>В игре</div>
            <div class="menu-item" data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="#8a7a63"
                stroke-width="1.5">
                <rect x="5" y="3" width="14" height="18" rx="1.5" />
                <path d="M9 8h6M9 12h6M9 16h4" />
              </svg>Журнал</div>
            <div class="menu-item active" data-tab="character"><svg viewBox="0 0 24 24" fill="none" stroke="#e8d5a0"
                stroke-width="1.5">
                <path d="M4 20l6-6M14 4l6 6-9 9-4-4z" />
              </svg>Навыки</div>
            <div class="menu-item" data-tab="abilities"><svg viewBox="0 0 24 24" fill="none" stroke="#8a7a63"
                stroke-width="1.5">
                <path d="M12 2l1.5 4 4 .5-3 3 .8 4-3.3-2-3.3 2 .8-4-3-3 4-.5z" />
              </svg>Способности</div>
            <div class="menu-item" data-tab="inventory"><svg viewBox="0 0 24 24" fill="none" stroke="#8a7a63"
                stroke-width="1.5">
                <path d="M6 8V6a6 6 0 0112 0v2M4 8h16l-1 13H5z" />
              </svg>Инвентарь</div>
            <div class="menu-item" data-tab="achievements"><svg viewBox="0 0 24 24" fill="none" stroke="#8a7a63"
                stroke-width="1.5">
                <path d="M6 3h12v5a6 6 0 01-12 0z" />
                <path d="M6 4H3v2a3 3 0 003 3M18 4h3v2a3 3 0 01-3 3M12 14v4M9 21h6" />
              </svg>Достижения</div>
            <div class="menu-item" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="#8a7a63"
                stroke-width="1.5">
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19 12a7 7 0 00-.2-1.6l2-1.5-2-3.4-2.3.9a7 7 0 00-2.8-1.6L13.3 2h-2.6l-.4 2.8a7 7 0 00-2.8 1.6l-2.3-.9-2 3.4 2 1.5a7 7 0 000 3.2l-2 1.5 2 3.4 2.3-.9a7 7 0 002.8 1.6l.4 2.8h2.6l.4-2.8a7 7 0 002.8-1.6l2.3.9 2-3.4-2-1.5c.1-.5.2-1 .2-1.6z" />
              </svg>Настройки</div>
          </div>
        </div>
      </div> <!-- закрываем main -->
    </div> <!-- закрываем container -->
  </div> <!-- закрываем main-content -->

  <!-- Подключение скриптов -->
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/tabs.js"></script>
</body>

</html>
