<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Менеджер задач</title>
    <style>
        body {
            background: #0f0b0a;
            color: #d4c8b0;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            border: 1px solid rgba(180, 150, 100, 0.3);
            border-radius: 20px;
            padding: 40px;
            background: rgba(20, 16, 14, 0.85);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        h1 {
            color: #e8d5a0;
            letter-spacing: 4px;
        }
        .status {
            color: #8a7a6a;
            margin-top: 20px;
        }
        .status span {
            color: #8bc34a;
        }
    </style>
</head>
<body>
    <div id="auth-container">
        <h2>Вход / Регистрация</h2>
        <input type="text" id="auth-username" placeholder="Логин">
        <input type="password" id="auth-password" placeholder="Пароль">
        <button id="login-btn">Войти</button>
        <button id="register-btn">Зарегистрироваться</button>
        <div id="auth-message"></div>
    </div>

    <div id="profile-container" style="display: none;">
        <span id="username-display"></span>
        <button id="logout-btn">Выйти</button>
    </div>

    <div id="main-content" style="display: none;">
        <!-- Здесь остаётся твой существующий интерфейс -->
        <nav class="tabs-nav">
            <button class="tab-btn active" data-tab="focus">Фокус</button>
            <button class="tab-btn" data-tab="tasks">Задачи</button>
            <button class="tab-btn" data-tab="character">Персона</button>
            <button class="tab-btn" data-tab="skills">Умения</button>
            <button class="tab-btn" data-tab="achievements">Достижения</button>
            <button class="tab-btn" data-tab="settings">Настройки</button>
            </nav>
        <!-- Контейнер для содержимого вкладок -->
        <div class="tabs-content">
            <!-- Вкладка "Фокус" -->
            <div id="tab-focus" class="tab-content active">
            <h2>Фокус</h2>
            <p>Здесь будут ваши главные цели и майндакрта.</p>
            </div>
            <!-- Вкладка "Задачи" -->
            <div id="tab-tasks" class="tab-content">
            <h2>Задачи</h2>
            <div id="tasksList">Список задач (загружается...)</div>
            </div>
            <!-- Вкладка "Персона" -->
            <div id="tab-character" class="tab-content">
            <h2>Персона</h2>
            <!-- ... весь блок персонажа ... -->
            </div>
            <!-- Вкладка "Персона" -->
            <div id="tab-character" class="tab-content">
                <h2>Персона</h2>
                <!-- ... весь блок персонажа ... -->
            </div>
            <!-- Остальные вкладки -->
        </div>
    </div>
<script type="module" src="js/auth.js"></script>
</body>
</html>
