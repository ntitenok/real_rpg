<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Менеджер задач</title>
    <style>
        body {
            background: #0f0b0a;
            color: #d4c8b0;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            border: 1px solid rgba(180, 150, 100, 0.3);
            border-radius: 20px;
            padding: 40px;
            background: rgba(20, 16, 14, 0.85);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        h1 {
            color: #e8d5a0;
            letter-spacing: 4px;
        }
        .status {
            color: #8a7a6a;
            margin-top: 20px;
        }
        .status span {
            color: #8bc34a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ RPG Менеджер задач</h1>
        <p>Сервер запущен, фронтенд раздаётся через Flask!</p>
        <p class="status">Статус: <span>✅ работает</span></p>
    </div>
</body>
</html>
